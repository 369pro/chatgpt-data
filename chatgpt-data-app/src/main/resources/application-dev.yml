server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8093}
  tomcat:
    mbeanregistry:
      enabled: true
    max-connections: 100
    threads:
      max: 100
      min-spare: 10
    accept-count: 10

app:
  config:
    api-version: v1
    cross-origin: ${APP_CROSS_ORIGIN:http://localhost:3003}
    limit-count: ${APP_FREE_CHAT_LIMIT:10}
    white-list: ${APP_WHITE_LIST:}
    model-types: ${APP_MODEL_TYPES:deepseek-flash,deepseek-v4-pro,glm-5.3-flash}
    test-code-enabled: false
    big-market:
      appId: ${BIG_MARKET_APP_ID:chatgpt-data}
      appToken: ${BIG_MARKET_APP_TOKEN:}

wxpay:
  config:
    enabled: ${WXPAY_ENABLED:false}
    appid: ${WXPAY_APP_ID:}
    mchid: ${WXPAY_MCH_ID:}
    notify-url: ${WXPAY_NOTIFY_URL:}
    private-key-path: ${WXPAY_PRIVATE_KEY_PATH:}
    merchant-serial-number: ${WXPAY_SERIAL_NUMBER:}
    api-v3-key: ${WXPAY_API_V3_KEY:}

thread:
  pool:
    executor:
      config:
        core-pool-size: 10
        max-pool-size: 20
        keep-alive-time: 5000
        block-queue-size: 1000
        policy: CallerRunsPolicy

wx:
  config:
    originalid: ${WECHAT_ORIGINAL_ID:}
    appid: ${WECHAT_APP_ID:}
    token: ${WECHAT_TOKEN:}

spring:
  datasource:
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/openai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 10000
  autoconfigure:
    exclude: org.redisson.spring.starter.RedissonAutoConfiguration

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

redis:
  sdk:
    config:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      pool-size: 10
      min-idle-size: 2
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

dubbo:
  application:
    name: ${DUBBO_APPLICATION_NAME:chatgpt-data-deepseek}
    version: 1.0
    qos-enable: false
  registry:
    id: nacos-registry
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:8848}
  consumer:
    check: false
  protocol:
    name: dubbo
    port: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info
  config: classpath:logback-spring.xml
